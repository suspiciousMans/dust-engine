[package]
name = "dust_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
sdl2.workspace = true
glow.workspace = true
glam.workspace = true
hecs.workspace = true
tobj.workspace = true
image.workspace = true
serde.workspace = true
ron.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
egui.workspace = true
egui_glow.workspace = true
egui_dock.workspace = true
gltf.workspace = true
bincode.workspace = true
# Script hot reload (dlopen + file watching). Both compile for emscripten;
# there they only ever report "not available" at runtime.
notify.workspace = true
libloading = "0.8"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# Vendor SDL2 wherever a system copy can't be assumed (Windows, CI, Linux
# without libsdl2-dev). Emscripten ships its own via -sUSE_SDL=2, so it is
# excluded from this table.
sdl2 = { workspace = true, features = ["bundled", "static-link"] }
rodio.workspace = true

[dev-dependencies]
env_logger.workspace = true
