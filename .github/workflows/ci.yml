name: CI

on:
  push:
    branches: [master, dust/main]
  pull_request:
    branches: [master, dust/main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    env:
      # Safety net: nothing in the test suite should open a window or an audio
      # device, but if something does it gets SDL's dummy drivers, not a crash.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sdl2-sys "bundled" builds SDL2 from source (CMake + a C compiler).
      # build-essential/cmake/pkg-config are the toolchain; the -dev packages
      # are what SDL's configure step probes for (audio, GL, X11), plus
      # libasound2-dev which rodio (via cpal) needs to link on Linux.
      # .cargo/config.toml already pins CMAKE_POLICY_VERSION_MINIMUM and
      # CFLAGS=-std=gnu11 for the same reasons as on a dev machine.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libudev-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --verbose

      # five_hundred_body_benchmark (engine/src/physics/sim.rs) is a timing
      # check that flakes on loaded shared runners, so it is skipped here.
      - name: Test workspace
        run: cargo test --workspace -- --skip five_hundred_body_benchmark

      # Release profile is LTO + codegen-units=1 + panic=abort; `check` proves
      # it (and the cfg!(debug_assertions)-gated editor paths) still compiles
      # without paying for a full optimized link.
      - name: Check workspace (release)
        run: cargo check --workspace --release

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workspace vendors SDL2 (sdl2-sys "bundled" feature), which
      # compiles it from source via CMake + a C compiler matching whatever
      # Rust host toolchain is active. Locally that's the GNU host
      # (x86_64-pc-windows-gnu) with a MinGW-w64 gcc — .cargo/config.toml's
      # CFLAGS/CMAKE_POLICY_VERSION_MINIMUM env vars are written for that
      # exact combination, so CI matches it rather than the MSVC default.
      - name: Install MinGW-w64 (gcc + cmake, for the GNU host toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
          path-type: inherit

      - name: Switch to the GNU host toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        shell: pwsh
        run: cargo build --workspace --verbose

      - name: Run engine test suite
        shell: pwsh
        run: cargo test -p dust_engine --verbose

      - name: Test workspace
        shell: pwsh
        run: cargo test --workspace
