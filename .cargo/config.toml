[env]
# Needed to build vendored SDL2 (sdl2-sys "bundled" feature) with this machine's
# toolchain: recent CMake (4.x) refuses old cmake_minimum_required versions, and
# this GCC defaults to C23 where SDL2's old bool-as-enum shim collides with the
# now-reserved bool/true/false keywords.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
CFLAGS = "-std=gnu11"

# Web build: `cargo build --release --target wasm32-unknown-emscripten` with the
# emsdk on PATH. SDL2 comes from emscripten's port; WebGL2 = GLES 3.0.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-args=-sUSE_SDL=2 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sFULL_ES3=1 -sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=134217728 -sEXIT_RUNTIME=0",
]
